<!DOCTYPE html>
<HTMl>  
    <head>
        <link rel="stylesheet" href="../css/homepage.css">
        <link rel="stylesheet" href="../css/header.css">
    </head>

    <body>  
        <div class="header">
            <a href="homepage.html" class="left">LOGO</a>
            <div class="middle">
                <input type="text" class="searchInput">
                <button class="cancel">X</button>
                <div class="searchResult"></div>
            </div>
            <a href="profile.html" class="right">
                <img src="../img/profile_icon.svg" alt="">
            </a>
        </div>

        <div class="homepage">
            <form class="addPost" enctype="multipart/form-data">
                <textarea type="text" class="addPostInput" name="content" placeholder="Write something..."></textarea>
                <div class="addImg">
                    <img src="../img/edit.svg" alt="">
                    <input class="imgsPreveiw" type="file" name="imgs" multiple hidden>
                </div>
                
                <button type="submit" class="postBtn">POST</button>
            </form>
        </div>  
        <script src="../script/homepage.js"></script>
        <script src="../script/header.js"></script>
    </body>
</HTMl>
